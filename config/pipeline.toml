# Configurazione della pipeline. I percorsi relativi sono risolti rispetto alla cartella del progetto
# (quella che contiene pyproject.toml).

[paths]
# Fonte primaria: solo le Tabelle dei campioni e della geochimica, senza Power Query né fogli derivati.
data_workbook = "input_data/Campioni_P_2025_Data_Raw.xlsx"
species_traits = "reference/species_traits.csv"
non_foram_terms = "config/non_foram_terms.csv"
name_corrections = "config/name_corrections.csv"
taxon_aliases = "config/taxon_aliases.csv"
worms_cache = "config/worms_cache.json"
output_dir = "output"

[input]
# Una tabella Excel è un campione se ha esattamente queste colonne; il nome della tabella è il nome del campione.
sample_columns = ["REPLICA", "N°SLIDE", "CASELLA", "SPECIE (LONG FORMAT)", "TIPO GUSCIO", "N°INDIVIDUI", "DEFORMATI"]
# Colonna di note scritta subito a destra della tabella del campione (fuori dalla Tabella Excel): viene letta anch'essa.
sample_comment_column = "COMMENTI & DUBBI"
geochemistry_table = "Geochimica_campioni"
geochemistry_sample_column = "Colonna1"
# Colonne della geochimica che sono risultati di calcolo e quindi vengono ignorate (ora calcolate dalla pipeline).
geochemistry_derived_columns = ["Shannon_H", "ORDINE"]
# Colonne della geochimica che descrivono la granulometria e devono sommare a ~100%.
grain_size_columns = ["GRAVEL", "SAND", "SILT"]
grain_size_tolerance_pct = 1.0

# Valori censurati nella geochimica: testo trovato → valore numerico usato (regola storica di Power Query).
[input.censored_values]
"> 200" = 201

# Campioni con una sola replica registrata (R1) da trattare come N repliche identiche: R1 viene copiata come R2..RN,
# quindi le conte entrano N volte negli indici (decisione dei ricercatori, 2026-10-30). Campione → numero di repliche.
[input.copied_replicas]
MC_FO02 = 3

[cleaning]
# I giovanili ("Genere Juvenile") confluiscono in "Genere spp." (decisione dei ricercatori, 2026-10-30).
juveniles_into_genus_spp = true
# Etichette (minuscole) che indicano un individuo non determinato.
not_determined_labels = ["not determined", "specie anomala"]
valid_shell_types = ["A", "I", "P"]
# Due nomi (generi, o epiteti dello stesso genere) più simili di questa soglia (0-1) vengono segnalati come possibili refusi.
similar_names_threshold = 0.8

[density]
# Densità faunistica = individui della replica / (volume_replica_ml / per_ml)
replica_volume_ml = 150
per_ml = 10

[taxonomy]
# Solo i record WoRMS di questo phylum sono accettati (evita omonimi in altri gruppi).
required_phylum = "Foraminifera"

[traits]
# Valori ammessi nella tabella reference/species_traits.csv
lifestyles = ["Epifaunale", "Epifita", "Infaunale superficiale", "Infaunale profondo", "ND"]
eco_groups = ["1", "2", "3", "4", "5", "NA"]
fsi_groups = ["Sen", "Str", "ND"]

# Calcolo facoltativo del Foram-AMBI con una diversa lista di assegnazione ai 5 gruppi ecologici
# per un sottoinsieme di campioni. Fanno fede solo le specie presenti nel file; le altre risultano non assegnate (NA).
[foram_ambi_alternative]
file = "reference/foram_ambi_alt.csv"
label = "Foram-AMBI (Bouchet 2021)"
groups_sheet = "Abbondanza_rel%_gruppiecol_alt"  # max 31 caratteri (limite di Excel)
groups_column = "GE Bouchet"  # colonna del foglio Confronto_gruppi_ecologici
samples = ["MC_FL01", "MC_FL02", "MC_FO01", "MC_FO02"]

# Fonti storiche usate una sola volta da `foramqs migrate-traits` per creare reference/species_traits.csv
[migration]
# Il vecchio workbook (con Power Query e le tabelle tecniche) serve solo alla migrazione dei tratti, già eseguita.
workbook = "input_data/Campioni_P_2025_Data.xlsx"
traits_table = "specie_stilevita"
foram_ambi_list = "../lists_for_feqs/Lista_Foram_AMBI.csv"
fsi_list = "../lists_for_feqs/Lista_FSI.csv"

# Foram-AMBI (foglio Foram-AMBI): si calcolano sempre due valori.
#   "Foram-AMBI ori" = come ForamEcoQS, gli individui senza gruppo ecologico (NA, anche i non determinati) pesano come GI;
#   "Foram-AMBI"     = gli NA sono ridistribuiti nei gruppi 1–5 in proporzione ai taxa assegnati (con la sua classe EQS).

# Classi di qualità ecologica (EQS): regole [classe, operatore, limite] valutate in ordine; l'ultima è [classe].
# Valori predefiniti di ForamEcoQS (BioticIndicesCalculator.cs).
[eqs]
# Dimiza et al. 2016
fsi = [["Azoic", "==", 0], ["High", ">=", 9], ["Good", ">=", 5.5], ["Moderate", ">=", 2], ["Poor", ">=", 1], ["Bad"]]
# Borja et al. 2003
foram_ambi = [["High", "<=", 1.2], ["Good", "<=", 3.3], ["Moderate", "<=", 4.3], ["Poor", "<=", 5.5], ["Bad"]]
# Soglie norvegesi, frazione 63 µm (alternativa italiana 63 µm: >=5, >=4, >=3, >2)
exp_hbc = [["High", ">=", 22], ["Good", ">=", 13], ["Moderate", ">=", 7], ["Poor", ">", 3], ["Bad"]]
# Colonna "EQS exp(H'bc) EQR": exp(H'bc) EQR = exp(H'bc) / massimo di exp(H'bc) tra i campioni, in 5 classi da 0.2
exp_hbc_eqr = [["HIGH", ">=", 0.8], ["GOOD", ">=", 0.6], ["MODERATE", ">=", 0.4], ["POOR", ">=", 0.2], ["BAD"]]

[tables]
# Soglia (frazione 0-1) delle specie dominanti: foglio Abb_rel_5% e, trasformate con log(1+x), fogli CA e PCA_CCA.
dominant_species_threshold = 0.05
# Come applicare le soglie:
#   "cella"  = un valore resta solo dove quella specie supera la soglia in quel campione (metodo Power Query storico);
#   "specie" = si tengono tutti i valori delle specie che superano la soglia in almeno un campione.
threshold_mode = "specie"
# Indice esterno (non calcolato dalla pipeline) presente nella geochimica: oggi solo controllato dalla validazione.
external_index_column = "M-AMBI_ 2022"
# Colonne della geochimica (profondità, granulometria, TOC, metalli pesanti) del foglio PCA_CCA, trasformate con log(1+x).
pca_cca_environment = [
    "DEPTH (m)", "GRAVEL", "SAND", "SILT", "TOC (%)",
    "As", "Cr", "Hg", "Ni", "Mn", "Fe", "Co", "Cu", "Zn", "Cd", "Sn", "Pb",
]

[labels]
shell = { A = "Agglutinated", I = "Hyaline", P = "Porcellaneous" }
lifestyle = { Epifaunale = "Epifaunal", Epifita = "Epiphytic", "Infaunale superficiale" = "Shallow infaunal", "Infaunale profondo" = "Deep infaunal", ND = "ND" }
lifestyle_abbreviation = { Epifaunale = "E", Epifita = "Epi", "Infaunale superficiale" = "Inf sup", "Infaunale profondo" = "Inf prof", ND = "ND" }

[cluster]
# Cluster Analysis (foglio CA) sulle specie del foglio Abb_rel_5% trasformate con log(1+x):
# Q-mode = campioni, R-mode = specie. L'ordine delle foglie del Q-mode è l'ordine dei campioni in tutti i fogli.
method = "ward"
metric = "euclidean"
# Gruppi di campioni definiti dai ricercatori leggendo il dendrogramma (dato tecnico, non calcolato).
# La validazione segnala i gruppi che non corrispondono a un ramo del dendrogramma Q-mode calcolato.
# Dal 2026-10-30 (decisione 2.5): taglio del dendrogramma in 3 rami.
[cluster.groups]
G1 = ["MC_FL01", "MC_FO02", "MC_FO01", "MC_VI01", "MC_ML01", "MC_FL02", "MC_ML02", "MC_VI02"]
G2 = ["MC_CB01", "MC_CE01"]
G3 = ["MC_CB02", "MC_PP01", "MC_PP02", "MC_PN01", "MC_PN02", "MC_SV01", "MC_CE02", "MC_SV02"]
